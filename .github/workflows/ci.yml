name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ldo2_edms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ldo2_edms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ldo2_edms_test
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
      REDIS_URL: redis://localhost:6379
      STORAGE_NAS_PATH: ./storage
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate environment
        run: bun run validate:env
      - name: Validate migration metadata
        run: bun run db:check
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: PostgreSQL integration check
        run: bun run test:integration
      - name: Production build
        run: bun run build
