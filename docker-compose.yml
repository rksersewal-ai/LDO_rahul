# =============================================================================
# LDO-2 EDMS - Development Services
# =============================================================================
# Start all services:  docker-compose up -d
# Stop all services:   docker-compose down
# View logs:           docker-compose logs -f
# Reset data:          docker-compose down -v
# =============================================================================

services:
  # PostgreSQL 16 - Primary database
  postgres:
    image: postgres:16-alpine
    container_name: ldo2-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ldo2_edms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ldo2_edms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis 7 - Job queues (BullMQ) and caching
  redis:
    image: redis:7-alpine
    container_name: ldo2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ldo2-app
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ldo2_edms
      AUTH_SECRET: local-compose-auth-secret-change-before-production
      REDIS_URL: redis://redis:6379
      STORAGE_NAS_PATH: /app/storage
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: ldo2_postgres_data
  redis_data:
    name: ldo2_redis_data
  app_storage:
    name: ldo2_app_storage
