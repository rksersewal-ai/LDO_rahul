# =============================================================================
# LDO-2 EDMS - Development Services
# =============================================================================
# Start all services:  docker-compose up -d
# Stop all services:   docker-compose down
# View logs:           docker-compose logs -f
# Reset data:          docker-compose down -v
# =============================================================================

services:
  # PostgreSQL 16 - Primary database
  postgres:
    image: postgres:16-alpine
    container_name: ldo2-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ldo2_edms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ldo2_edms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis 7 - Job queues (BullMQ) and caching
  redis:
    image: redis:7-alpine
    container_name: ldo2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: ldo2_postgres_data
  redis_data:
    name: ldo2_redis_data
